name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签，例如 v1.0.0"
        required: true
        type: string

      release_name:
        description: "Release 名称，留空则使用标签"
        required: false
        type: string

      prerelease:
        description: "是否发布为预发布版本"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "PNG提取工具" `
            png_extractor_gui.py

      - name: Rename build artifact
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          Copy-Item `
            "dist/PNG提取工具.exe" `
            "dist/PNG提取工具-$tag-windows-x64.exe"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $releaseName = "${{ inputs.release_name }}"

          if ([string]::IsNullOrWhiteSpace($releaseName)) {
            $releaseName = $tag
          }

          $arguments = @(
            "release",
            "create",
            $tag,
            "dist/PNG提取工具-$tag-windows-x64.exe",
            "--title",
            $releaseName,
            "--generate-notes"
          )

          if ("${{ inputs.prerelease }}" -eq "true") {
            $arguments += "--prerelease"
          }

          gh @arguments
